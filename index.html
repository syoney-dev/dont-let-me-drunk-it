<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Don't Let Me Drunk It</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="tier-0">
  <header class="hud">
    <div class="win wipe">
      <canvas id="portrait" width="32" height="32"></canvas>
    </div>
    <div class="win battle">
      <canvas id="battle" width="96" height="48"></canvas>
      <p id="battleMsg" class="battle-msg">&nbsp;</p>
    </div>
    <div class="win counter">
      <div class="counter-label">きんしゅ</div>
      <div class="counter-num"><span id="days">0</span><small>にち</small></div>
      <div id="rank" class="counter-rank">みならい</div>
    </div>
  </header>

  <main>
    <section class="win">
      <h2 id="dateLabel" class="win-title">きょう の きろく</h2>
      <div class="cmds" role="radiogroup" aria-label="きょう のんだ？">
        <button class="cmd" data-status="sober" role="radio" aria-checked="false">のまなかった</button>
        <button class="cmd" data-status="drank" role="radio" aria-checked="false">のんでしまった</button>
      </div>
      <label class="diary-label" for="note">ひとこと にっき</label>
      <textarea id="note" maxlength="100" rows="3" placeholder="きょうの きもちを ひとこと…"></textarea>
      <div class="row">
        <span id="noteCount" class="muted">0/100</span>
        <button id="save" class="btn">きろくする</button>
      </div>
    </section>

    <section class="win msg-win">
      <p id="msg" class="msg"></p>
    </section>

    <section class="win">
      <h2 class="win-title">つよさ</h2>
      <dl class="status">
        <dt>なまえ</dt><dd id="stName"></dd>
        <dt>ランク</dt><dd id="stRank"></dd>
        <dt>ぶき</dt><dd id="stWeapon"></dd>
        <dt>よろい</dt><dd id="stArmor"></dd>
        <dt>てき</dt><dd id="stMonster"></dd>
      </dl>
      <p id="stNext" class="muted"></p>
    </section>

    <section class="win">
      <h2 class="win-title">ぼうけんの しょ</h2>
      <ul id="log" class="log"></ul>
    </section>

    <div class="row footer-row">
      <button id="openSettings" class="btn">せってい</button>
    </div>
  </main>

  <dialog id="settings" class="win">
    <h2 class="win-title">せってい</h2>
    <label class="field">なまえ
      <input id="setName" maxlength="6" autocomplete="off">
    </label>
    <fieldset class="field">
      <legend>しゅじんこう</legend>
      <label><input type="radio" name="gender" value="m"> おとこ</label>
      <label><input type="radio" name="gender" value="f"> おんな</label>
    </fieldset>
    <label class="field">おためし にっすう（みためだけ）
      <select id="setPreview">
        <option value="">つかわない</option>
        <option value="0">0にち</option>
        <option value="3">3にち</option>
        <option value="7">7にち</option>
        <option value="14">14にち</option>
        <option value="30">30にち</option>
        <option value="100">100にち</option>
      </select>
    </label>
    <div class="row">
      <button id="reset" class="btn danger">ぼうけんの しょを けす</button>
      <button id="closeSettings" class="btn">とじる</button>
    </div>
  </dialog>

  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
